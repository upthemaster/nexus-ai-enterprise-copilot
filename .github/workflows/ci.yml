name: NexusAI CI/CD Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Test Suite & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install CPU-Optimized PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Backend Dependencies
        run: |
          pip install --no-cache-dir -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          APP_ENV: testing
          DEBUG: "false"
          PYTHONPATH: backend
          DATA_DIR: ./data
        run: |
          pytest backend/tests -v

  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm ci || npm install

      - name: TypeScript Type-Checking & Lint
        run: |
          npx tsc --noEmit

      - name: Build Vite Production Assets
        run: |
          npm run build

  docker-validation:
    name: Docker Configuration & Syntax Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Environment Template for Validation
        run: |
          cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

